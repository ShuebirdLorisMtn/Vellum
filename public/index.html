<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Vellum — App</title>
    <style>
      body { font-family: system-ui, Arial; max-width: 900px; margin: 2rem auto; padding: 1rem; }
      label { display:block; margin-top: 0.75rem; font-weight:600 }
      input, textarea { width:100%; padding:0.6rem; margin-top:0.25rem; }
      button { margin-top: 1rem; padding: 0.6rem 1rem; }
      pre { background:#f6f8fa; padding:1rem; white-space:pre-wrap }
      .info { color:#666; font-size:0.9rem }
    </style>
  </head>
  <body>
    <h1>Vellum — Generate a document</h1>

    <div id="auth">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" />
      <button id="signup">Get my free document</button>
      <p class="info">We will create an account for this email and give you one free document. After that you'll be prompted to purchase.</p>
    </div>

    <div id="app" style="display:none">
      <p>Signed in as <span id="who"></span> — <a id="signout" href="#">sign out</a></p>
      <label for="title">Title (optional)</label>
      <input id="title" />
      <label for="prompt">Describe the document you want</label>
      <textarea id="prompt" rows="6" placeholder="Write a stern but professional email about missed deadlines."></textarea>
      <button id="generate">Generate document</button>
      <p class="info">First document is free. After that you'll be prompted to purchase.</p>

      <h3>Output</h3>
      <pre id="output">(no output yet)</pre>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
